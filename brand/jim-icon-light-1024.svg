<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Jim app icon, light. Full bleed square, no transparency, no baked corner radius.
       iOS applies its own squircle mask. -->
  <rect width="1024" height="1024" fill="#FFFFFF"/>
  <g transform="scale(10.24)">
    <g transform="translate(50,50) scale(1.08) translate(-44,-50.5)">
      <!-- unfilled segments -->
      <path d="M66 20 L66 52 A22 22 0 1 1 44 30"
            fill="none" stroke="#C5D8FB" stroke-width="14"
            stroke-dasharray="21.93 6.5"/>
      <!-- filled segments (3 of 5) -->
      <path d="M66 20 L66 52 A22 22 0 1 1 44 30"
            fill="none" stroke="#2563EB" stroke-width="14"
            stroke-dasharray="21.93 6.5 21.93 6.5 21.93 400"/>
    </g>
  </g>
</svg>
