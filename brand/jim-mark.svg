<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" fill="none">
  <!-- Bare Jim mark. Transparent background. All five segments one colour.
       stroke="currentColor" so it inherits the text/tint colour of its container.
       Use this for nav bars, wordmark lockups, favicons, anywhere that is not the app icon. -->
  <g transform="translate(50,50) scale(1.08) translate(-44,-50.5)">
    <path d="M66 20 L66 52 A22 22 0 1 1 44 30"
          fill="none" stroke="currentColor" stroke-width="14"
          stroke-dasharray="21.93 6.5"/>
  </g>
</svg>
