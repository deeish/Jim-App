# Frontend CI – runs on push/PR to main.

name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # No cache: package-lock.json is gitignored at repo root, so path wouldn't resolve

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit
