# Optional: run Playwright smokes against a deployed Expo Web staging URL.
# Requires repo secrets: E2E_STAGING_EMAIL, E2E_STAGING_PASSWORD, PLAYWRIGHT_BASE_URL

name: E2E staging (Expo Web)

on:
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check required secrets
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
          E2E_STAGING_EMAIL: ${{ secrets.E2E_STAGING_EMAIL }}
          E2E_STAGING_PASSWORD: ${{ secrets.E2E_STAGING_PASSWORD }}
        run: |
          test -n "$PLAYWRIGHT_BASE_URL" || { echo "Set secret PLAYWRIGHT_BASE_URL (staging Expo Web origin)"; exit 1; }
          test -n "$E2E_STAGING_EMAIL" || { echo "Set secret E2E_STAGING_EMAIL"; exit 1; }
          test -n "$E2E_STAGING_PASSWORD" || { echo "Set secret E2E_STAGING_PASSWORD"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Run E2E
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          E2E_STAGING_EMAIL: ${{ secrets.E2E_STAGING_EMAIL }}
          E2E_STAGING_PASSWORD: ${{ secrets.E2E_STAGING_PASSWORD }}
        run: npm run e2e
